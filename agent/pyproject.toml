[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehome-agent"
version = "0.1.0"
description = "PhoneHome phone agent: runs on the Raspberry Pi inside the phone (hook switch, audio, ringer)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Real audio devices (desktop simulation and the Pi). Needs PortAudio
# (bundled on Windows/macOS wheels; `apt install libportaudio2` on Linux).
audio = ["sounddevice>=0.4.6"]
# Raspberry Pi GPIO. On Raspberry Pi OS prefer the apt packages
# python3-gpiozero + python3-lgpio and a venv with --system-site-packages.
pi = ["gpiozero>=2.0", "lgpio>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
phonehome-agent = "phonehome_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
