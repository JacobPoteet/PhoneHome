[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehome-server"
version = "0.1.0"
description = "PhoneHome server: message archive, web app and the API the phone talks to."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "soundfile>=0.12",
  "httpx>=0.25",
]

[project.optional-dependencies]
# Local speech-to-text. Pulls in CTranslate2; the model downloads on first use.
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.24"]

[project.scripts]
phonehome-server = "phonehome_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Docker build copies web/build here so the image is self-contained.
phonehome_server = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
